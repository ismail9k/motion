    - the 9k colours as CSS variables (--k9-bg, --k9-green, --k9-orange, --k9-text, --k9-muted …)
    - IBM Plex Sans Arabic / Sans / Mono, from assets/fonts/ (installed with this component, SIL OFL 1.1)

-->
