<script>
(function(){
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

function bez(x1,y1,x2,y2){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;const sx=s=>((ax*s+bx)*s+cx)*s,sy=s=>((ay*s+by)*s+cy)*s;return x=>{x=clamp(x);let s=x;for(let i=0;i<8;i++){const dx=(3*ax*s+2*bx)*s+cx;if(Math.abs(dx)<1e-6)break;s-=(sx(s)-x)/dx;}return sy(clamp(s));};}
const e9=bez(.4,0,.2,1),eCss=bez(.25,.1,.25,1);
const tw=(t,s,d,f=e9)=>f(clamp((t-s)/d));
const env=(t,dur,p='default')=>{const k=sp(t,p),o=tw(t,dur-.25,.25);return{k,a:Math.min(clamp(t*6),1-o),y:(1-k)*44.8+o*16};};

const op=(el,a)=>{el.style.opacity=String(Math.max(0,Math.min(1,a)));};
const root=document.getElementById('g04-scene'),$=(r)=>root.querySelector('[data-role='+r+']');

const load=$('load'),N=+load.dataset.people,LAND=+load.dataset.land,OVER=+load.dataset.over;

const NS='http://www.w3.org/2000/svg',OK='#72DA9A',WARN='#F4C871',ERR='#F39191',DIM='#404040';
// number-wheel (HyperFrames registry component, spin "double" so the zeros roll too)
const strips=[];{const w=$('wheel');for(const ch of w.dataset.value){if(!/\d/.test(ch)){w.append(ch);continue;}const stops=10+ +ch,f=document.createElement('span'),s=document.createElement('span');
  f.className='hf-number-wheel-digit';s.className='hf-number-wheel-strip';for(let i=0;i<=stops;i++){const d=document.createElement('span');d.textContent=String(i%10);s.appendChild(d);}f.appendChild(s);w.appendChild(f);strips.push({s,stops});}}
// the crowd: seeded, so every frame is the same on every render
let seed=9;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);
const RX=380,RY=267,people=[];
for(let i=0;i<N;i++){const a=rnd()*Math.PI*2,u=document.createElementNS(NS,'use');u.setAttribute('href','#g04-person');crowd.appendChild(u);
  const sx=RX+Math.cos(a)*(470+rnd()*80),sy=RY+Math.sin(a)*(300+rnd()*60);
  people.push({u,s:.12+(i/N)*2.6+rnd()*.25,dur:.85+rnd()*.35,sx,sy,ex:RX+Math.cos(a)*(70+rnd()*20),ey:RY+Math.sin(a)*(60+rnd()*15)});}
const lerp=(a,b,k)=>a+(b-a)*k,out3=x=>1-Math.pow(1-clamp(x),3);
function render(t){
  const e=env(t,D,'heavy');op(load,e.a);
  const over=t>=OVER,ok=sp(t-OVER,'snappy'),shake=over?Math.sin(t*70)*5*Math.max(.25,1-(t-OVER)*1.2):0;
  load.style.transform='translateY('+e.y+'px)';load.classList.toggle('over',over);
  // count rolls to 500, landing on his words
  const kn=out3((t-.1)/(LAND-.1));strips.forEach((d,i)=>{const k=out3((t-.1-i*.12)/(LAND-.1-i*.12));d.s.style.transform='translateY('+(-d.stops*k)+'em)';});

  let inside=0;
  for(const p of people){const k=(t-p.s)/p.dur;if(k<0||k>=1){p.u.setAttribute('opacity','0');if(k>=1)inside++;continue;}
    const m=e9(k),x=lerp(p.sx,p.ex,m),y=lerp(p.sy,p.ey,m),sc=1.25-.55*clamp((k-.6)/.4);
    p.u.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale('+sc.toFixed(3)+')');p.u.setAttribute('opacity',String(Math.min(clamp(k*5),1-clamp((k-.8)/.2))*.92));}

}
