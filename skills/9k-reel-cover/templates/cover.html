<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>9k Reel Cover</title>
<style>
  @font-face { font-family: 'Thmanyah Serif Display'; font-weight: 900; src: local('Thmanyah Serif Display Black'), local('ThmanyahSerifDisplay-Black'), url('fonts/thmanyahserifdisplay-Black.otf'); }
  @font-face { font-family: 'Thmanyah Sans'; font-weight: 700; src: local('Thmanyah Sans Bold'), local('ThmanyahSans-Bold'), url('fonts/thmanyahsans-Bold.otf'); }
  @font-face { font-family: 'Thmanyah Sans'; font-weight: 500; src: local('Thmanyah Sans Medium'), local('ThmanyahSans-Medium'), url('fonts/thmanyahsans-Medium.otf'); }
  @font-face { font-family: 'IBM Plex Sans'; font-weight: 700; src: url('fonts/IBMPlexSans-Bold.woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url('fonts/IBMPlexMono-Regular.woff2'); }
  @font-face { font-family: 'IBM Plex Mono'; font-weight: 700; src: url('fonts/IBMPlexMono-Bold.woff2'); }

  /* Values from the 9k design tokens (dark theme), as used on ismail9k.com and 9k.school */
  :root {
    --green: #166434;          /* --primary-color */
    --green-text: #2FB163;     /* dark-theme --primary-text-color, hsl(143 58% 44%) */
    --orange: #E85A02;         /* --accent-color */
    --ink: #0A111A;            /* --dark-color */
    --bg: #0F0F0F;             /* dark-theme --theme-bg-color */
    --text: #F5F5F5;
    --muted: #A3A3A3;
    --line: rgb(255 255 255 / .12);
    --pad: 84px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }

  .cover { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--text); font-family: 'Thmanyah Sans', sans-serif;
    background:
      radial-gradient(ellipse 70% 38% at 18% 6%, rgb(22 100 52 / .30), transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 62%, rgb(22 100 52 / .26), transparent 70%),
      radial-gradient(ellipse 55% 30% at 100% 100%, rgb(232 90 2 / .20), transparent 70%),
      var(--bg); }
  /* the dot texture from 9k.school's course cards, scaled up for a 1080px canvas */
  .dots { position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      radial-gradient(circle, rgb(255 255 255 / .09) 0 1.2px, transparent 1.6px),
      radial-gradient(circle, rgb(22 100 52 / .55) 0 1.1px, transparent 1.5px);
    background-position: 0 0, 6px 8px; background-size: 12px 12px, 18px 18px; }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .stars i { position: absolute; width: 5px; height: 5px; }

  /* ---------- header: wordmark with the green cursor + #tag pill ---------- */
  .header { position: absolute; top: 268px; inset-inline: var(--pad); display: flex; align-items: center; justify-content: space-between; z-index: 20; }
  .wordmark { direction: ltr; font: 700 40px/1 'IBM Plex Sans', sans-serif; letter-spacing: -.01em; color: var(--text); }
  .wordmark b { display: inline-block; width: .5em; height: .1em; margin-inline-start: .06em; background: var(--green-text); vertical-align: baseline; }
  .pill { direction: ltr; font: 700 30px/1 'IBM Plex Sans', 'Thmanyah Sans', sans-serif; color: var(--text); padding: 14px 24px 15px; border: 2px solid var(--line); border-radius: 999px; background: rgb(255 255 255 / .03); }

  /* ---------- title ---------- */
  .title-block { position: absolute; top: 352px; inset-inline: var(--pad); z-index: 20; }
  h1 { font-family: 'Thmanyah Serif Display', serif; font-weight: 900; font-size: var(--title-size, 140px); line-height: 1.12; color: var(--text); }
  h1 .line { display: block; white-space: nowrap; }
  h1 .hl { color: var(--green-text); }
  .subtitle { display: inline-block; margin-top: 22px; font-weight: 500; font-size: 44px; line-height: 1.3; color: #E5E5E5; }
  .subtitle mark { color: inherit; background: rgb(22 100 52 / .55); padding: 0 .18em .06em; border-radius: 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

  /* ---------- lab: the untouched frame inside a course-lab window ---------- */
  .window { position: absolute; z-index: 10; left: 90px; top: 800px; width: 900px; height: 840px; border: 2px solid var(--line); border-radius: 26px; overflow: hidden;
    background: #0C1310; box-shadow: 0 0 0 1px rgb(0 0 0 / .4), 0 40px 120px rgb(22 100 52 / .28), 0 30px 60px rgb(0 0 0 / .45); }
  .window .bar { direction: ltr; height: 62px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 2px solid var(--line);
    font: 400 24px/1 'IBM Plex Mono', monospace; color: var(--muted); background: rgb(255 255 255 / .02); }
  .window .bar i { width: 14px; height: 14px; border-radius: 50%; }
  .window .bar span { margin-inline-start: 12px; }
  .window .photo { position: absolute; inset: 62px 0 0; background-size: 118% auto; background-position: 50% 21%; filter: saturate(.94) contrast(1.03); }
  .window .photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 70%, rgb(10 17 26 / .5)); }

  /* ---------- glow: cutout with a green halo ---------- */
  .halo { position: absolute; z-index: 9; left: 50%; top: 760px; width: 980px; height: 980px; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(circle, rgb(47 177 99 / .38), rgb(22 100 52 / .18) 45%, transparent 70%); }
  .ring { position: absolute; z-index: 9; left: 50%; top: 830px; width: 760px; height: 760px; transform: translateX(-50%); border-radius: 50%; border: 3px solid rgb(47 177 99 / .55); }
  .person { position: absolute; z-index: 10; left: var(--px, 0px); top: var(--py, 540px); width: var(--pw, 1000px);
    filter: drop-shadow(0 0 2px rgb(0 0 0 / .6)) drop-shadow(0 30px 40px rgb(0 0 0 / .45)); }
  .fade { position: absolute; z-index: 11; inset: auto 0 0; height: 300px; background: linear-gradient(transparent, var(--bg) 85%); }

  /* ---------- hero: a generated, theme-lit photo, bottom-anchored and full-bleed ---------- */
  .hero-img { position: absolute; z-index: 5; left: 0; bottom: var(--hb, 0px); width: 1080px; }
  .hero-fade { position: absolute; z-index: 6; inset: 0 0 auto; height: var(--hf, 900px); background: linear-gradient(var(--bg) 30%, rgb(15 15 15 / .85) 55%, transparent); }
  /* textures stay in the empty top; the photo already carries its own specks */
  .v-hero .dots, .v-hero .stars { z-index: 7; -webkit-mask-image: linear-gradient(#000 0 38%, transparent 46%); mask-image: linear-gradient(#000 0 38%, transparent 46%); }
  .v-hero .dots { opacity: .4; }
  .v-hero .art { width: 470px; left: 24px; top: 1360px; }

  /* ---------- shared optional pieces ---------- */
  .art { position: absolute; z-index: 12; width: 560px; left: 30px; top: 1430px; transform: rotate(-3deg); filter: drop-shadow(0 24px 30px rgb(0 0 0 / .5)); }
  .v-glow .art { width: 500px; left: 10px; top: 1290px; }
  .spark { position: absolute; z-index: 13; width: 74px; right: 96px; top: 760px; }
  .prompt { position: absolute; z-index: 20; left: 90px; right: 90px; top: 1700px; direction: ltr; text-align: left; font: 400 32px/1 'IBM Plex Mono', monospace; color: var(--muted); }
  .prompt b { color: var(--green-text); font-weight: 700; }
  .prompt .caret { display: inline-block; width: 16px; height: 34px; margin-inline-start: 6px; background: var(--orange); vertical-align: -6px; }
</style>
</head>
<body>
<div class="cover" id="cover">
  <div class="dots"></div>
  <div class="stars" id="stars"></div>

  <div class="header">
    <span class="pill" id="tag"></span>
    <span class="wordmark">Ismail9k<b></b></span>
  </div>

  <div class="title-block">
    <h1 id="title"></h1>
    <div class="subtitle" id="subtitle"></div>
  </div>

  <div id="stage"></div>
</div>

<script>
  // Query params (one file serves every reel):
  //   v       lab | glow
  //   title   lines split by "|", green words wrapped in [ ]
  //   sub     subtitle; wrap words in [ ] for the green marker (no brackets = whole line marked)
  //   tag     the pill, e.g. "#AI"
  //   photo   untouched frame (lab)      cut  transparent cutout (glow)
  //   label   window path text (lab), e.g. "9k / course-lab"
  //   art     optional story object (transparent PNG/WebP), e.g. a 9k course illustration
  //   prompt  optional mono line at the bottom, e.g. "9k.school"
  //   px py pw  nudge the cutout
  const q = new URLSearchParams(location.search);
  const v = q.get('v') || 'lab';
  const cover = document.getElementById('cover');
  cover.classList.add('v-' + v);
  for (const k of ['px', 'py', 'pw', 'hb', 'hf']) if (q.get(k)) cover.style.setProperty('--' + k, q.get(k) + 'px');
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  document.getElementById('title').innerHTML = (q.get('title') || '').split('|')
    .map(l => '<span class="line">' + esc(l).replace(/\[(.+?)\]/g, '<span class="hl">$1</span>') + '</span>').join('');
  const subEl = document.getElementById('subtitle'), sub = q.get('sub');
  if (sub) subEl.innerHTML = /\[.+\]/.test(sub) ? esc(sub).replace(/\[(.+?)\]/g, '<mark>$1</mark>') : '<mark>' + esc(sub) + '</mark>';
  else subEl.remove();
  const tag = document.getElementById('tag');
  if (q.get('tag')) tag.textContent = q.get('tag'); else tag.style.visibility = 'hidden';

  const stage = document.getElementById('stage');
  if (v === 'lab') {
    stage.innerHTML = `<div class="window"><div class="bar"><i style="background:#E85A02"></i><i style="background:#6B6B6B"></i><i style="background:#2FB163"></i><span>${esc(q.get('label') || 'ismail9k / reels')}</span></div><div class="photo"></div></div>`;
    stage.querySelector('.photo').style.backgroundImage = `url("${q.get('photo')}")`;
  } else if (v === 'hero') {
    stage.innerHTML = `<img class="hero-img" src="${q.get('hero')}" alt=""><div class="hero-fade"></div>`;
  } else {
    stage.innerHTML = `<div class="halo"></div><div class="ring"></div><img class="person" src="${q.get('cut')}" alt=""><div class="fade"></div>`;
  }
  if (q.get('art')) stage.insertAdjacentHTML('beforeend', `<img class="art" src="${q.get('art')}" alt="">`);
  // the orange eight-point star from the 9k course art
  stage.insertAdjacentHTML('beforeend', `<svg class="spark" viewBox="0 0 100 100" aria-hidden="true"><path fill="#E85A02" d="M50 2 56 36 78 12 66 42 98 38 68 54 92 76 60 64 62 98 50 68 38 98 40 64 8 76 32 54 2 38 34 42 22 12 44 36Z"/></svg>`);
  if (q.get('prompt')) stage.insertAdjacentHTML('beforeend', `<div class="prompt"><b>›</b> ${esc(q.get('prompt'))}<span class="caret"></span></div>`);

  // Pixel starfield like ismail9k.com's footer: seeded, so a cover always renders the same.
  let seed = 9; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const stars = document.getElementById('stars'), colors = ['#2FB163', '#2FB163', '#E85A02', 'rgb(255 255 255 / .55)'];
  for (let i = 0; i < 70; i++) {
    const y = rnd() < .7 ? 1500 + rnd() * 420 : rnd() * 260;      // mostly along the bottom, a few at the top
    const s = document.createElement('i');
    s.style.cssText = `left:${(rnd() * 1080) | 0}px;top:${y | 0}px;background:${colors[(rnd() * colors.length) | 0]};opacity:${(.35 + rnd() * .6).toFixed(2)}`;
    stars.appendChild(s);
  }

  document.fonts.ready.then(() => {
    const h1 = document.getElementById('title'), max = h1.clientWidth;
    let size = parseFloat(getComputedStyle(h1).fontSize);
    while ([...h1.querySelectorAll('.line')].some(l => l.scrollWidth > max) && size > 80) { size -= 4; h1.style.fontSize = size + 'px'; }
  });
</script>
</body>
</html>
